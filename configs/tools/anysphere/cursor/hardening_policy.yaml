schema_version: '1.0'
tool:
  name: cursor
  vendor: anysphere
  category: ide
  description: Cursor IDE - AI-native code editor built on VS Code foundation
paths:
  windows:
    config_dir: '%APPDATA%\Cursor\User'
    settings_file: '%APPDATA%\Cursor\User\settings.json'
  linux:
    config_dir: ~/.config/Cursor/User
    settings_file: ~/.config/Cursor/User/settings.json
  macos:
    config_dir: ~/Library/Application Support/Cursor/User
    settings_file: ~/Library/Application Support/Cursor/User/settings.json
policies:
  sandbox:
    enforce_sandbox: true
    default_bypass: false
  approvals:
    require_approval_for_terminal: true
    require_approval_for_network: true
  rate_limit:
    max_requests_per_minute: 30
    max_tokens_per_minute: 100000
    max_daily_budget_usd: 10.0
    burst_limit: 10
  timeout:
    execution_timeout_seconds: 60
    command_timeout_seconds: 30
    network_timeout_seconds: 15
    read_timeout_seconds: 30
  dangerous_paths:
    linux:
    - /etc
    - /etc/shadow
    - /etc/sudoers
    - /etc/sudoers.d
    - /etc/passwd
    - /etc/group
    - /etc/ssl
    - /etc/crontab
    - /etc/cron.*
    - /boot
    - /root
    - /sys
    - /proc
    - /dev
    - /var/log
    - /var/run
    - /var/backups
    - /usr/local/bin
    - /usr/bin
    - /sbin
    - /bin
    - ~/.ssh
    - ~/.gnupg
    - ~/.aws
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.config/gcloud
    - ~/.bashrc
    - ~/.zshrc
    - ~/.profile
    - ~/.bash_profile
    - ~/.bash_history
    - ~/.zsh_history
    - ~/.git-credentials
    - ~/.netrc
    - ~/.config/gh
    - ~/.npmrc
    - ~/.pypirc
    - ~/.credentials.json
    - ~/.claude.json
    windows:
    - C:\Windows
    - C:\Windows\System32
    - C:\Windows\System32\drivers\etc
    - C:\Windows\SysWOW64
    - C:\Program Files
    - C:\Program Files (x86)
    - C:\ProgramData
    - C:\Boot
    - C:\Recovery
    - C:\System Volume Information
    - C:\$Recycle.Bin
    - '%USERPROFILE%\.ssh'
    - '%USERPROFILE%\.aws'
    - '%USERPROFILE%\.azure'
    - '%USERPROFILE%\.kube'
    - '%USERPROFILE%\.docker'
    - '%USERPROFILE%\AppData\Local\Microsoft\Credentials'
    - '%USERPROFILE%\AppData\Roaming\Microsoft\Vault'
    - '%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu'
    - '%USERPROFILE%\.git-credentials'
    - '%USERPROFILE%\_netrc'
    - '%USERPROFILE%\.npmrc'
    - '%USERPROFILE%\.pypirc'
    - '%USERPROFILE%\.credentials.json'
    - '%USERPROFILE%\.claude.json'
    - \\*
    macos:
    - /System
    - /System/Library
    - /Library
    - /private
    - /private/etc
    - /private/var
    - /private/tmp
    - /Volumes
    - /usr/bin
    - /usr/sbin
    - /bin
    - /sbin
    - ~/.ssh
    - ~/.gnupg
    - ~/.aws
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.config/gcloud
    - ~/Library/Keychains
    - ~/Library/Application Support/com.apple.sharedfilelist
    - ~/.zshrc
    - ~/.bash_profile
    - ~/.bashrc
    - ~/.zsh_history
    - ~/.bash_history
    - ~/.git-credentials
    - ~/.netrc
    - ~/.config/gh
    - ~/.credentials.json
    - ~/.claude.json
  dlp:
    block_sensitive_paths:
    - '**/.env*'
    - '**/*.pem'
    - '**/*.key'
    - '**/*.pfx'
    - '**/*.p12'
    - '**/*_rsa'
    - '**/*_ed25519'
    - ~/.ssh/**
    - ~/.aws/**
    - ~/.kube/**
    - ~/.gnupg/**
    - ~/.git-credentials
    - ~/.netrc
    - ~/.docker/config.json
    disable_code_training_sharing: true
  telemetry:
    enable_telemetry: false
  strict_rules:
    action: block_without_prompting
    denied_patterns:
      linux:
      - rm\s+-(?:r|f|rf|fr)\s+/(?:\s|$|\*)
      - rm\s+-(?:r|f|rf|fr)\s+/etc
      - rm\s+-(?:r|f|rf|fr)\s+/boot
      - rm\s+-(?:r|f|rf|fr)\s+/root
      - ':\(\)\s*\{\s*:\|:&\s*\}\s*;\s*:'
      - dd\s+if=/dev/zero
      - dd\s+if=/dev/urandom
      - mkfs\.[a-z0-9]+\s+/dev/sd[a-z]
      - mkfs\s+
      - '>\s*/dev/sd[a-z]'
      - chmod\s+-(?:R|r)\s+777\s+/
      - chown\s+-(?:R|r)\s+nobody\s+/
      - mv\s+/\s+/dev/null
      - wget.*\|\s*(?:sh|bash)
      - curl.*\|\s*(?:sh|bash)
      - wipefs\s+
      - fdisk\s+
      - gdisk\s+
      - parted\s+
      - lvreduce\s+
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
      windows:
      - format-volume\s+
      - 'format\s+[a-zA-Z]:'
      - clear-disk\s+
      - initialize-disk\s+
      - remove-partition\s+
      - resize-partition\s+
      - diskpart\s+
      - cipher\s+/w
      - chkdsk\s+/f
      - remove-item\s+.*-recurse\s+c:\\windows
      - del\s+/f\s+/s\s+/q\s+c:\\windows
      - rd\s+/s\s+/q\s+c:\\
      - set-mppreference\s+.*-disablerealtimemonitoring
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
      macos:
      - diskutil\s+eraseDisk
      - diskutil\s+partitionDisk
      - diskutil\s+apfs\s+deleteContainer
      - gpt\s+
      - newfs_apfs\s+
      - newfs_hfs\s+
      - dd\s+if=/dev/zero\s+of=/dev/r?disk
      - asr\s+--restore
      - rm\s+-(?:r|f|rf|fr)\s+/(?:\s|$|\*)
      - rm\s+-(?:r|f|rf|fr)\s+/System
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
    native_overrides:
      cursor.deniedTerminalPatterns:
      - rm -rf /
      - mkfs*
      - dd if=/dev/zero*
      - format*
      - diskpart*
      - diskutil eraseDisk*
      cursor.terminal.strictExecution: true
      cursor.composer.autoApply: false
      cursor.chat.autoApply: false
      cursor.agent.yoloMode: false
      cursor.mcp.requireConsent: true
  native_settings_override:
    cursor.privacyMode: true
    cursor.general.privacy: no-retention
    cursor.terminal.autoExecute: false
    cursor.terminal.sandbox: true
    cursor.terminal.legacyTerminalTool: false
    cursor.terminal.timeout: 60
    cursor.agent.yoloMode: false
    cursor.composer.autoApply: false
    cursor.composer.requireUserApproval: true
    cursor.chat.autoApply: false
    cursor.mcp.requireConsent: true
    cursor.agent.autoExecuteTerminal: false
    cursor.rateLimit.requestsPerMinute: 30
    security.workspace.trust.enabled: true
    telemetry.telemetryLevel: 'off'
    cursor.indexer.ignorePatterns:
    - .env*
    - '*.pem'
    - '*.key'
    - '*.pfx'
    - '*.p12'
    - '*_rsa'
    - '*_ed25519'
    - '**/.aws/**'
    - '**/.ssh/**'
    - '**/.kube/**'
    - '**/.gnupg/**'
    - '**/.docker/config.json'
custom_scripts:
  windows: scripts/os/windows/apply-hardening.ps1
  linux: scripts/os/linux/apply-hardening.sh
  macos: scripts/os/macos/apply-hardening.sh
