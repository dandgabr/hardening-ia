schema_version: '1.0'
tool:
  name: claude-code
  vendor: anthropic
  category: cli
  description: Claude Code CLI - Agentic command line assistant with autonomous tools
    and enterprise sandboxing
paths:
  windows:
    config_dir: '%USERPROFILE%\.claude'
    settings_file: '%USERPROFILE%\.claude\settings.json'
    rules_dir: '%USERPROFILE%\.claude\rules'
    managed_settings_file: '%ProgramData%\ClaudeCode\managed-settings.json'
  linux:
    config_dir: ~/.claude
    settings_file: ~/.claude/settings.json
    rules_dir: ~/.claude/rules
    managed_settings_file: /etc/claude-code/managed-settings.json
  macos:
    config_dir: ~/.claude
    settings_file: ~/.claude/settings.json
    rules_dir: ~/.claude/rules
    managed_settings_file: /Library/Application Support/ClaudeCode/managed-settings.json
policies:
  sandbox:
    enforce_sandbox: true
    allowUnsandboxedCommands: false
    failIfUnavailable: true
    autoAllowBashIfSandboxed: true
    filesystem:
      disabled: false
      denyWrite:
      - C:\Windows
      - C:\Windows\System32
      - C:\Program Files
      - C:\Program Files (x86)
      - C:\ProgramData
      - /etc
      - /boot
      - /root
      - /sys
      - /proc
      - /dev
      - /var/log
      - /usr/bin
      - /usr/sbin
      - /sbin
      - /bin
      - /System
      - /Library
      - /private
      denyRead:
      - '**/.env*'
      - '**/*.pem'
      - '**/*.key'
      - ~/.ssh
      - ~/.aws
      - ~/.azure
      - ~/.kube
      - ~/.gnupg
      - ~/.git-credentials
      - ~/.netrc
      - ~/.docker/config.json
      - ~/.credentials.json
      - ~/.claude.json
      - '%USERPROFILE%\.ssh'
      - '%USERPROFILE%\.aws'
      - '%USERPROFILE%\.azure'
      - '%USERPROFILE%\.kube'
      - '%USERPROFILE%\AppData\Local\Microsoft\Credentials'
      - '%USERPROFILE%\AppData\Roaming\Microsoft\Vault'
    network:
      strictAllowlist: false
      allowedDomains:
      - github.com
      - '*.github.com'
      - '*.githubusercontent.com'
      - registry.npmjs.org
      - '*.npmjs.org'
      - pypi.org
      - files.pythonhosted.org
      deniedDomains:
      - 169.254.169.254
      - metadata.google.internal
      - 100.100.100.200
      - localhost
      - 127.0.0.1
      - 0.0.0.0
      - '[::1]'
      - '*.local'
      - '*.internal'
    credentials:
      allowPlaintextInject: false
      envVars:
      - name: ANTHROPIC_API_KEY
        mode: deny
      - name: ANTHROPIC_AUTH_TOKEN
        mode: deny
      - name: AWS_ACCESS_KEY_ID
        mode: deny
      - name: AWS_SECRET_ACCESS_KEY
        mode: deny
      - name: AWS_SESSION_TOKEN
        mode: deny
      - name: AZURE_CLIENT_SECRET
        mode: deny
      - name: GITHUB_TOKEN
        mode: deny
      - name: GH_TOKEN
        mode: deny
      - name: OPENAI_API_KEY
        mode: deny
      - name: GEMINI_API_KEY
        mode: deny
      - name: DATABASE_URL
        mode: deny
      - name: DB_PASSWORD
        mode: deny
  approvals:
    permissionMode: manual
    defaultMode: manual
    autoApprove: []
    acceptEdits: false
    dangerouslySkipPermissions: false
    disableBypassPermissionsMode: disable
    disableAutoMode: disable
    permissionExplainerEnabled: true
  rate_limit:
    max_requests_per_minute: 30
    max_tokens_per_minute: 100000
    max_daily_budget_usd: 10.0
    burst_limit: 10
  timeout:
    execution_timeout_seconds: 60
    command_timeout_seconds: 30
    network_timeout_seconds: 15
    read_timeout_seconds: 30
  dangerous_paths:
    linux:
    - /etc
    - /etc/shadow
    - /etc/sudoers
    - /etc/sudoers.d
    - /etc/passwd
    - /etc/group
    - /etc/ssl
    - /etc/crontab
    - /etc/cron.*
    - /boot
    - /root
    - /sys
    - /proc
    - /dev
    - /var/log
    - /var/run
    - /var/backups
    - /usr/local/bin
    - /usr/bin
    - /sbin
    - /bin
    - ~/.ssh
    - ~/.gnupg
    - ~/.aws
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.config/gcloud
    - ~/.bashrc
    - ~/.zshrc
    - ~/.profile
    - ~/.bash_profile
    - ~/.bash_history
    - ~/.zsh_history
    - ~/.git-credentials
    - ~/.netrc
    - ~/.config/gh
    - ~/.npmrc
    - ~/.pypirc
    - ~/.credentials.json
    - ~/.claude.json
    windows:
    - C:\Windows
    - C:\Windows\System32
    - C:\Windows\System32\drivers\etc
    - C:\Windows\SysWOW64
    - C:\Program Files
    - C:\Program Files (x86)
    - C:\ProgramData
    - C:\Boot
    - C:\Recovery
    - C:\System Volume Information
    - C:\$Recycle.Bin
    - '%USERPROFILE%\.ssh'
    - '%USERPROFILE%\.aws'
    - '%USERPROFILE%\.azure'
    - '%USERPROFILE%\.kube'
    - '%USERPROFILE%\.docker'
    - '%USERPROFILE%\AppData\Local\Microsoft\Credentials'
    - '%USERPROFILE%\AppData\Roaming\Microsoft\Vault'
    - '%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu'
    - '%USERPROFILE%\.git-credentials'
    - '%USERPROFILE%\_netrc'
    - '%USERPROFILE%\.npmrc'
    - '%USERPROFILE%\.pypirc'
    - '%USERPROFILE%\.credentials.json'
    - '%USERPROFILE%\.claude.json'
    - \\*
    macos:
    - /System
    - /System/Library
    - /Library
    - /private
    - /private/etc
    - /private/var
    - /private/tmp
    - /Volumes
    - /usr/bin
    - /usr/sbin
    - /bin
    - /sbin
    - ~/.ssh
    - ~/.gnupg
    - ~/.aws
    - ~/.azure
    - ~/.kube
    - ~/.docker
    - ~/.config/gcloud
    - ~/Library/Keychains
    - ~/Library/Application Support/com.apple.sharedfilelist
    - ~/.zshrc
    - ~/.bash_profile
    - ~/.bashrc
    - ~/.zsh_history
    - ~/.bash_history
    - ~/.git-credentials
    - ~/.netrc
    - ~/.config/gh
    - ~/.credentials.json
    - ~/.claude.json
  dlp:
    block_sensitive_paths:
    - '**/.env*'
    - '**/*.pem'
    - '**/*.key'
    - '**/*.pfx'
    - '**/*.p12'
    - '**/*_rsa'
    - '**/*_ed25519'
    - ~/.ssh/**
    - ~/.aws/**
    - ~/.kube/**
    - ~/.gnupg/**
    - ~/.git-credentials
    - ~/.netrc
    - ~/.docker/config.json
    disable_code_training_sharing: true
  telemetry:
    enable_telemetry: false
    CLAUDE_CODE_ENABLE_TELEMETRY: 0
    CLAUDE_TELEMETRY_DISABLED: true
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
    DISABLE_TELEMETRY: 1
    DISABLE_AUTOUPDATER: 1
    feedbackSurveyRate: 0
    autoMemoryEnabled: false
    disableArtifact: true
    audit_logging: true
  strict_rules:
    action: block_without_prompting
    denied_patterns:
      linux:
      - rm\s+-(?:r|f|rf|fr)\s+/(?:\s|$|\*)
      - rm\s+-(?:r|f|rf|fr)\s+/etc
      - rm\s+-(?:r|f|rf|fr)\s+/boot
      - rm\s+-(?:r|f|rf|fr)\s+/root
      - ':\(\)\s*\{\s*:\|:&\s*\}\s*;\s*:'
      - dd\s+if=/dev/zero
      - dd\s+if=/dev/urandom
      - mkfs\.[a-z0-9]+\s+/dev/sd[a-z]
      - mkfs\s+
      - '>\s*/dev/sd[a-z]'
      - chmod\s+-(?:R|r)\s+777\s+/
      - chown\s+-(?:R|r)\s+nobody\s+/
      - mv\s+/\s+/dev/null
      - wget.*\|\s*(?:sh|bash)
      - curl.*\|\s*(?:sh|bash)
      - wipefs\s+
      - fdisk\s+
      - gdisk\s+
      - parted\s+
      - lvreduce\s+
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
      windows:
      - format-volume\s+
      - 'format\s+[a-zA-Z]:'
      - clear-disk\s+
      - initialize-disk\s+
      - remove-partition\s+
      - resize-partition\s+
      - diskpart\s+
      - cipher\s+/w
      - chkdsk\s+/f
      - remove-item\s+.*-recurse\s+c:\\windows
      - del\s+/f\s+/s\s+/q\s+c:\\windows
      - rd\s+/s\s+/q\s+c:\\
      - set-mppreference\s+.*-disablerealtimemonitoring
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
      macos:
      - diskutil\s+eraseDisk
      - diskutil\s+partitionDisk
      - diskutil\s+apfs\s+deleteContainer
      - gpt\s+
      - newfs_apfs\s+
      - newfs_hfs\s+
      - dd\s+if=/dev/zero\s+of=/dev/r?disk
      - asr\s+--restore
      - rm\s+-(?:r|f|rf|fr)\s+/(?:\s|$|\*)
      - rm\s+-(?:r|f|rf|fr)\s+/System
      - dangerouslyDisableSandbox
      - 169\.254\.169\.254
    native_overrides:
      permissions:
        defaultMode: manual
        disableBypassPermissionsMode: disable
        disableAutoMode: disable
        allow: []
      sandbox:
        enabled: true
        autoAllowBashIfSandboxed: false
        allowUnsandboxedCommands: false
        failIfUnavailable: true
        filesystem:
          allowManagedReadPathsOnly: true
        network:
          strictAllowlist: true
          allowManagedDomainsOnly: true
      disableSideloadFlags: true
      allowManagedHooksOnly: true
      allowManagedPermissionRulesOnly: true
      allowManagedMcpServersOnly: true
      acceptEdits: false
      permissionMode: manual
      autoApprove: []
  native_settings_override:
    $schema: https://json.schemastore.org/claude-code-settings.json
    permissions:
      defaultMode: manual
      disableBypassPermissionsMode: disable
      disableAutoMode: disable
      deny:
      - Read(//**/.env*)
      - Read(//**/*.env*)
      - Read(//**/*.pem)
      - Read(//**/*.key)
      - Read(//**/*.pfx)
      - Read(//**/*.p12)
      - Read(//**/*_rsa)
      - Read(//**/*_ed25519)
      - Read(~/.ssh/**)
      - Read(~/.aws/**)
      - Read(~/.azure/**)
      - Read(~/.kube/**)
      - Read(~/.gnupg/**)
      - Read(~/.git-credentials)
      - Read(~/.netrc)
      - Read(~/.docker/config.json)
      - Read(~/.credentials.json)
      - Read(~/.claude.json)
      - Read(//c/**/.env*)
      - Read(//c/Windows/**)
      - Read(//c/Program Files/**)
      - Read(//c/ProgramData/**)
      - Read(\\*)
      - Edit(\\*)
      - Write(\\*)
      - Read(//etc/**)
      - Read(//boot/**)
      - Read(//root/**)
      - Read(//sys/**)
      - Read(//proc/**)
      - Read(//System/**)
      - Read(//Library/**)
      - Read(//private/**)
      - Edit(//**/.git/hooks/**)
      - Edit(//**/.git/config)
      - Write(//**/.git/hooks/**)
      - Write(//**/.git/config)
      - WebFetch(domain:169.254.169.254)
      - WebFetch(domain:metadata.google.internal)
      - WebFetch(domain:100.100.100.200)
      - WebFetch(domain:localhost)
      - WebFetch(domain:127.0.0.1)
      - WebFetch(domain:0.0.0.0)
      - WebFetch(domain:[::1])
      - Bash(dangerouslyDisableSandbox:true)
      - Bash(rm -rf /*)
      - Bash(rm -rf /)
      - Bash(rm -rf /etc*)
      - Bash(rm -rf /boot*)
      - Bash(rm -rf /root*)
      - Bash(rm -rf /System*)
      - Bash(mkfs*)
      - Bash(dd if=/dev/zero*)
      - Bash(dd if=/dev/urandom*)
      - Bash(wipefs*)
      - Bash(fdisk*)
      - Bash(gdisk*)
      - Bash(parted*)
      - Bash(lvreduce*)
      - Bash(diskutil eraseDisk*)
      - Bash(diskutil partitionDisk*)
      - Bash(chmod -R 777 /*)
      - Bash(chown -R nobody /*)
      - Bash(mv /* /dev/null*)
      - Bash(curl *|*sh*)
      - Bash(wget *|*sh*)
      - Bash(curl *|*bash*)
      - Bash(wget *|*bash*)
      - PowerShell(format*)
      - PowerShell(Format-Volume*)
      - PowerShell(Clear-Disk*)
      - PowerShell(Initialize-Disk*)
      - PowerShell(Remove-Partition*)
      - PowerShell(Resize-Partition*)
      - PowerShell(diskpart*)
      - PowerShell(cipher /w*)
      - PowerShell(chkdsk /f*)
      - PowerShell(Remove-Item *-Recurse *C:\Windows*)
      - PowerShell(del */f */s */q *C:\Windows*)
      - PowerShell(rd */s */q *C:\*)
      - PowerShell(Set-MpPreference *-DisableRealtimeMonitoring*)
      allow: []
      ask:
      - Bash(*)
      - PowerShell(*)
      - Edit(*)
      - Write(*)
      - WebFetch(*)
    sandbox:
      enabled: true
      autoAllowBashIfSandboxed: true
      allowUnsandboxedCommands: false
      failIfUnavailable: true
      filesystem:
        disabled: false
        denyWrite:
        - C:\Windows
        - C:\Windows\System32
        - C:\Program Files
        - C:\Program Files (x86)
        - C:\ProgramData
        - /etc
        - /boot
        - /root
        - /sys
        - /proc
        - /dev
        - /var/log
        - /usr/bin
        - /usr/sbin
        - /sbin
        - /bin
        - /System
        - /Library
        - /private
        denyRead:
        - '**/.env*'
        - '**/*.pem'
        - '**/*.key'
        - ~/.ssh
        - ~/.aws
        - ~/.azure
        - ~/.kube
        - ~/.gnupg
        - ~/.git-credentials
        - ~/.netrc
        - ~/.docker/config.json
        - ~/.credentials.json
        - ~/.claude.json
        - '%USERPROFILE%\.ssh'
        - '%USERPROFILE%\.aws'
        - '%USERPROFILE%\.azure'
        - '%USERPROFILE%\.kube'
        - '%USERPROFILE%\AppData\Local\Microsoft\Credentials'
        - '%USERPROFILE%\AppData\Roaming\Microsoft\Vault'
      network:
        strictAllowlist: false
        allowedDomains:
        - github.com
        - '*.github.com'
        - '*.githubusercontent.com'
        - registry.npmjs.org
        - '*.npmjs.org'
        - pypi.org
        - files.pythonhosted.org
        deniedDomains:
        - 169.254.169.254
        - metadata.google.internal
        - 100.100.100.200
        - localhost
        - 127.0.0.1
        - 0.0.0.0
        - '[::1]'
        - '*.local'
        - '*.internal'
      credentials:
        allowPlaintextInject: false
        envVars:
        - name: ANTHROPIC_API_KEY
          mode: deny
        - name: ANTHROPIC_AUTH_TOKEN
          mode: deny
        - name: AWS_ACCESS_KEY_ID
          mode: deny
        - name: AWS_SECRET_ACCESS_KEY
          mode: deny
        - name: AWS_SESSION_TOKEN
          mode: deny
        - name: AZURE_CLIENT_SECRET
          mode: deny
        - name: GITHUB_TOKEN
          mode: deny
        - name: GH_TOKEN
          mode: deny
        - name: OPENAI_API_KEY
          mode: deny
        - name: GEMINI_API_KEY
          mode: deny
        - name: DATABASE_URL
          mode: deny
        - name: DB_PASSWORD
          mode: deny
    permissionExplainerEnabled: true
    feedbackSurveyRate: 0
    autoMemoryEnabled: false
    disableArtifact: true
    disableDeepLinkRegistration: disable
    disableSkillShellExecution: true
    disableRemoteControl: true
    remoteControlAtStartup: false
    disableClaudeAiConnectors: true
    strictPluginOnlyCustomization: true
    browserExternalPageTools: disabled
    disableBrowserExternalNavigation: true
    disableMobileSimulatorTools: true
    respectGitignore: true
    cleanupPeriodDays: 7
    autoUpdatesChannel: stable
    env:
      DO_NOT_TRACK: '1'
      CLAUDE_DISABLE_TELEMETRY: '1'
      CLAUDE_TELEMETRY_DISABLED: '1'
      CLAUDE_CODE_ENABLE_TELEMETRY: '0'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: '1'
      DISABLE_TELEMETRY: '1'
      DISABLE_AUTOUPDATER: '1'
    permissionMode: manual
    autoApprove: []
    acceptEdits: false
    disableTelemetry: true
    allowBypassSandbox: false
    dangerouslySkipPermissions: false
    maxCostThresholdUSD: 10.0
    timeoutSeconds: 60
    commandTimeoutSeconds: 30
    rateLimitPerMinute: 30
custom_scripts:
  windows: scripts/os/windows/apply-hardening.ps1
  linux: scripts/os/linux/apply-hardening.sh
  macos: scripts/os/macos/apply-hardening.sh
