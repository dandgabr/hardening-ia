[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hardening-ia"
version = "0.1.0"
description = "Enterprise framework for automating security hardening, DLP, and runtime containment for AI tools"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.9"
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
hardening-ia = "main:main"
