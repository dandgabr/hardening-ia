name: Build & Release Standalone Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-binaries:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
            arch: x86_64
            artifact_name: hardening-ia-linux-x86_64.tar.gz
            exe_name: hardening-ia
          - os: windows-latest
            platform_name: windows
            arch: x64
            artifact_name: hardening-ia-windows-x64.zip
            exe_name: hardening-ia.exe
          - os: macos-latest
            platform_name: macos
            arch: universal
            artifact_name: hardening-ia-macos-universal.tar.gz
            exe_name: hardening-ia

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Automated Test Suite (Quality Gate)
        run: |
          python main.py --test

      - name: Compile Standalone Native Executable via PyInstaller
        run: |
          pyinstaller --clean hardening-ia.spec

      - name: Validate Compiled Standalone Binary
        shell: bash
        run: |
          if [[ "${{ matrix.platform_name }}" == "windows" ]]; then
            ./dist/hardening-ia.exe --list
            ./dist/hardening-ia.exe --test
          else
            chmod +x ./dist/hardening-ia
            ./dist/hardening-ia --list
            ./dist/hardening-ia --test
          fi

      - name: Package Release Archive (Linux / macOS)
        if: matrix.platform_name != 'windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp dist/${{ matrix.exe_name }} dist/package/
          cp README.md dist/package/
          cp LICENSE dist/package/
          tar -czf dist/${{ matrix.artifact_name }} -C dist/package .

      - name: Package Release Archive (Windows)
        if: matrix.platform_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\package | Out-Null
          Copy-Item dist\${{ matrix.exe_name }} dist\package\
          Copy-Item README.md dist\package\
          Copy-Item LICENSE dist\package\
          Compress-Archive -Path dist\package\* -DestinationPath dist\${{ matrix.artifact_name }} -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Cryptographic SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "=== Generated SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
